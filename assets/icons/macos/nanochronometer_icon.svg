<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 0 228 228" width="228" height="228">
<!-- Generated by tools/gen-icons.py. The N is Nanoplex, as an outline. -->
  <defs>
    <!-- Neon green glow for the N letter and bezel -->
    <filter id="neonGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4.5" result="blur"/>
      <feFlood flood-color="#22ff44" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Softer glow for rim and smaller elements -->
    <filter id="rimGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#33ff55" flood-opacity="0.55" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Watch face: dark sphere with green highlight -->
    <radialGradient id="watchBody" cx="38%" cy="34%" r="64%" gradientUnits="objectBoundingBox">
      <stop offset="0%"  stop-color="#203c20"/>
      <stop offset="28%" stop-color="#0d1e0d"/>
      <stop offset="65%" stop-color="#070d07"/>
      <stop offset="100%" stop-color="#030603"/>
    </radialGradient>

    <!-- Outer bezel green ring -->
    <radialGradient id="rimGrad" cx="32%" cy="26%" r="70%" gradientUnits="objectBoundingBox">
      <stop offset="0%"  stop-color="#66ff88"/>
      <stop offset="22%" stop-color="#3ddd5a"/>
      <stop offset="58%" stop-color="#17991f"/>
      <stop offset="100%" stop-color="#0a4d11"/>
    </radialGradient>

    <!-- Dark ring between rim and face -->
    <radialGradient id="innerRimGrad" cx="36%" cy="30%" r="66%" gradientUnits="objectBoundingBox">
      <stop offset="0%"  stop-color="#182a18"/>
      <stop offset="100%" stop-color="#05080a"/>
    </radialGradient>

    <!-- N letter gradient -->
    <linearGradient id="nGrad" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%"  stop-color="#77ffaa"/>
      <stop offset="40%" stop-color="#33cc55"/>
      <stop offset="100%" stop-color="#0d8822"/>
    </linearGradient>

    <!-- Top crown button -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#44bb55"/>
      <stop offset="100%" stop-color="#0c3d14"/>
    </linearGradient>

    <!-- Side lugs -->
    <linearGradient id="lugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#0e4418"/>
      <stop offset="50%" stop-color="#1e7730"/>
      <stop offset="100%" stop-color="#0e4418"/>
    </linearGradient>

    <!-- Center pivot dot -->
    <radialGradient id="dotGrad" cx="38%" cy="35%" r="62%">
      <stop offset="0%"  stop-color="#ddfff0"/>
      <stop offset="100%" stop-color="#2dbb44"/>
    </radialGradient>
  </defs>
<!-- ============ STOPWATCH ICON (center: 108, 118) ============ -->

  <!-- Drop shadow -->
  <ellipse cx="108" cy="214" rx="82" ry="6.5" fill="#000000" opacity="0.10"/>

  <!-- Top crown button -->
  <rect x="96" y="4" width="24" height="21" rx="5" fill="url(#btnGrad)" filter="url(#rimGlow)"/>
  <rect x="98" y="5" width="20" height="17" rx="4" fill="#1a8830"/>
  <rect x="100" y="7" width="9" height="5" rx="2.5" fill="#55cc66" opacity="0.55"/>

  <!-- Left lug -->
  <g transform="rotate(-40, 108, 118)">
    <rect x="17" y="111" width="27" height="15" rx="4" fill="url(#lugGrad)" filter="url(#rimGlow)"/>
    <rect x="18" y="112" width="25" height="13" rx="3" fill="#1a6630"/>
  </g>

  <!-- Right lug -->
  <g transform="rotate(40, 108, 118)">
    <rect x="172" y="111" width="27" height="15" rx="4" fill="url(#lugGrad)" filter="url(#rimGlow)"/>
    <rect x="173" y="112" width="25" height="13" rx="3" fill="#1a6630"/>
  </g>

  <!-- Outer green bezel -->
  <circle cx="108" cy="118" r="97" fill="url(#rimGrad)" filter="url(#rimGlow)"/>

  <!-- Dark ring just inside bezel -->
  <circle cx="108" cy="118" r="89" fill="url(#innerRimGrad)"/>

  <!-- Main face -->
  <circle cx="108" cy="118" r="83" fill="url(#watchBody)"/>

  <!-- Face edge ring (subtle) -->
  <circle cx="108" cy="118" r="83" fill="none" stroke="#1d6626" stroke-width="1.2" opacity="0.4"/>

  <!-- Major tick marks -->
  <g stroke="#2ecc44" stroke-width="2.8" stroke-linecap="round">
    <line x1="108" y1="34"  x2="108" y2="46"/>
    <line x1="192" y1="118" x2="180" y2="118"/>
    <line x1="108" y1="202" x2="108" y2="190"/>
    <line x1="24"  y1="118" x2="36"  y2="118"/>
  </g>

  <!-- Minor tick marks -->
  <g stroke="#157722" stroke-width="1.5" stroke-linecap="round" opacity="0.65">
    <line x1="150" y1="45.25"  x2="146" y2="52.18"/>
    <line x1="180.75" y1="76"  x2="173.82" y2="80"/>
    <line x1="180.75" y1="160" x2="173.82" y2="156"/>
    <line x1="150" y1="190.75" x2="146" y2="183.82"/>
    <line x1="66"  y1="190.75" x2="70"  y2="183.82"/>
    <line x1="35.25" y1="160"  x2="42.18" y2="156"/>
    <line x1="35.25" y1="76"   x2="42.18" y2="80"/>
    <line x1="66"  y1="45.25"  x2="70"  y2="52.18"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="141" cy="151" r="2.5" fill="#22aa33" opacity="0.60"/>
  <circle cx="73"  cy="87"  r="2.2" fill="#22aa33" opacity="0.52"/>
  <circle cx="149" cy="89"  r="1.8" fill="#22aa33" opacity="0.44"/>
  <circle cx="67"  cy="151" r="2.3" fill="#22aa33" opacity="0.52"/>

  <!-- The large N letter (Nanoplex) -->
  <g filter="url(#neonGlow)"><path d="M130.71428571428572 171.0V155.85714285714286V140.71428571428572V125.57142857142857H115.57142857142857V110.42857142857143H130.71428571428572V95.28571428571429V80.14285714285714V65.0H145.85714285714283V80.14285714285714V95.28571428571429V110.42857142857143V125.57142857142857V140.71428571428572V155.85714285714286V171.0ZM70.14285714285714 171.0V155.85714285714286V140.71428571428572V125.57142857142857V110.42857142857143V95.28571428571429V80.14285714285714V65.0H85.28571428571428V80.14285714285714H100.42857142857142V95.28571428571429H115.57142857142857V110.42857142857143H100.42857142857142V95.28571428571429H85.28571428571428V110.42857142857143V125.57142857142857V140.71428571428572V155.85714285714286V171.0Z" fill="url(#nGrad)"/></g>

  <!-- Subtle face glow ring -->
  <circle cx="108" cy="118" r="82" fill="none" stroke="#33ee55" stroke-width="0.7" opacity="0.20"/>

  <!-- Center pivot dot -->
  <circle cx="108" cy="118" r="6.5" fill="url(#dotGrad)" filter="url(#rimGlow)"/>
  <circle cx="108" cy="118" r="3.2" fill="#ddfff0"/>
  <circle cx="108" cy="118" r="1.3" fill="#ffffff"/>

  </svg>
