# SPDX-License-Identifier: Apache-2.0
#
# Generates include/baremetal/nanochrono.h from
# crates/nanochrono-baremetal/src/abi.rs — that file alone: it is the whole C
# ABI of the bare-metal library, and the rest of the crate is Rust API and
# kernel. Run tools/gen-header.sh; nothing in this repository is hand-written C.

language = "C"
header = """/* SPDX-License-Identifier: Apache-2.0 */
/* =============================================================================
 * nanochrono.h — C ABI for NanoChronometer on bare metal
 *
 * GENERATED FILE. Do not edit.
 *
 * Regenerate with tools/gen-header.sh. The declarations are derived from
 * crates/nanochrono-baremetal/src/abi.rs, which is the single source of
 * truth: the implementation is Rust and there is no hand-written C here.
 *
 * Link against libnanochrono.a in lib64/ (lib/ on a 32-bit target), which
 * needs nothing more, or libnanochrono.so beside it, which needs a loader of
 * your own: bare metal has no ld.so to map it and resolve its symbols. See
 * README.md next to lib64/ and BAREMETAL_LIBRARIES.md.
 *
 * Freestanding: only <stdbool.h>, <stddef.h> and <stdint.h> are included.
 *
 * Assembly: this header can be #included from a .S file. The constants are
 * plain #defines; the C declarations sit under #ifndef __ASSEMBLER__. Call a
 * function by its name with the target's C calling convention.
 *
 * Contract:
 *   - Every function is a ring 0 / EL1 interface.
 *   - Nothing unwinds across the boundary (panic = abort).
 *   - NC_RNG — its functions, constants and nc_rng_status_t — matches the
 *     hosted libnanochrono exactly, so the same C builds against either.
 * ========================================================================== */"""
include_guard = "NANOCHRONO_H"
cpp_compat = true
documentation = true
documentation_style = "c"
tab_width = 4
style = "type"
# A freestanding compiler has no <stdlib.h>; these three are all it needs.
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]

[export]
prefix = ""

[enum]
prefix_with_name = true
