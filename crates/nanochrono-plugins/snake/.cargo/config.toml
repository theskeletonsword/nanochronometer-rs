# The plugin targets the same freestanding x86-64 ABI as the kernel's shared
# object: PIC, dynamically linkable, no kernel code model. Built from source
# because a custom target has no precompiled core.
[build]
target = "x86_64-nanochrono-none-dylib"

[target.x86_64-nanochrono-none-dylib]
rustflags = [
    "-Z", "unstable-options",
    "-C", "no-redzone=yes",
    # A .so keeps undefined symbols (the kernel imports) as dynamic symbols
    # resolved at load time, rather than failing the link.
    "-C", "link-arg=-znodefaultlib",
]

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

# The custom target spec lives in the kernel crate; reuse it.
[env]
RUST_TARGET_PATH = { value = "../../nanochrono-baremetal/targets", relative = true }
