[package]
name = "nanochrono-plugin-snake"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Snake, as a NanoChronometer app (.ncapp, and .ncpkg). An original, not a port."

[lib]
# A shared object (ET_DYN) is what tools/ncplu.py packs into an .ncapp: the
# loader wants position-independent code with only dynamic relocations.
crate-type = ["cdylib"]

# Debug: -O0 with debug info, to step through under GDB. Release: -O3 — the
# build a user gets, and the one that is signed. No unwinder on bare metal.
[profile.dev]
opt-level = 0
debug = true
panic = "abort"

[profile.release]
# Released plugins are -O2, as the kernel is.
opt-level = 2
debug = false
lto = true
codegen-units = 1
panic = "abort"

# The -Og build: the dev profile's symbols and checks (debug info, debug
# assertions, overflow checks) with basic optimisation, so a bug that only
# shows once code is optimised turns up while it can still be stepped through.
# Rust has no -Og; opt-level 1 is its counterpart. Debugging uses both levels.
[profile.debug-og]
inherits = "dev"
opt-level = 1
