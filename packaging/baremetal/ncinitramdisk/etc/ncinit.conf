# /etc/ncinit.conf - the ncinitramdisk's configuration.
#
# The boot loader hands this image to the kernel as `ncinitramdisk`; the
# kernel checks its seal and merges it into the file tree before any session
# starts (cat /proc/ncinitramdisk). docs/SYSTEM.md describes the boot
# sequence this file configures. Today the kernel reads none of it: the
# first process (init.ncapp) that will is planned, and these are the
# settings it is designed to take.

# The root filesystem: an NCFS volume, by label or by fsid.
root = label:ncroot
# If the root does not mount or fails its checks: shell | halt
on_root_failure = shell

# Memory filesystems, mounted before the root.
tmpfs /tmp           size=25%
tmpfs /run           size=8M
ramfs /var/volatile
# Compressed swap in RAM, before any page file or swap partition.
zram  swap           size=50% algorithm=lz4

# Drivers outside the kernel, loaded in this order from /boot/drivers.
# Essential drivers (NCFS, exFAT, FAT32, SATA, NVMe, USB HID, I2C-HID) are
# built into the kernel and need no line here.
#drivers = intel-me android-mtp
