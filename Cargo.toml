[workspace]
resolver = "2"
members = [
    "crates/nanochrono-core",
    "crates/nanochrono-crypto",
    "crates/nanochrono-bench",
    "crates/nanochrono-cli",
    "crates/nanochrono-gui",
    "crates/nanochrono-ffi",
    "crates/nanochrono-android",
]

# Freestanding: it targets `x86_64-unknown-none`/`aarch64-unknown-none`, has no
# `main`, and links through its own script. `cargo build --workspace` would try
# to build it for the host and fail, so it is its own root and is built by
# packaging/baremetal/build.sh.
exclude = ["crates/nanochrono-baremetal", "crates/nanochrono-plugins", "tools/ncplu-sign"]

[workspace.package]
version = "4.0.0"
edition = "2021"
# 1.89: the AVX-512 target features and intrinsics (the AVX-512 probes, and
# NC_RNG's VAES-512 output path) were stabilised there; nothing older builds
# the workspace.
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/nanochronometer/nanochronometer"
description = "Nanosecond-resolution chronometer, clock and ISA microbenchmark toolkit"

[workspace.dependencies]
nanochrono-core = { path = "crates/nanochrono-core", version = "4.0.0" }
nanochrono-crypto = { path = "crates/nanochrono-crypto", version = "4.0.0" }
nanochrono-bench = { path = "crates/nanochrono-bench", version = "4.0.0" }

# Two optimised profiles.
#
# `release` is for building and running during development: thin LTO and 16
# codegen units spread the optimiser over every core, so a GUI build (iced,
# wgpu, ~650 crates) links in a fraction of the time. `dist` is what is
# published: whole-program ("fat") LTO in one codegen unit, the smallest and
# fastest binary, at the cost of a long single-threaded link. The packaging
# scripts build `dist`; `cargo build --release` stays quick.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16

[profile.dist]
inherits = "release"
# What ships, and what the published releases are built at: -O2. Every other
# level builds too (OPT=, packaging/opt-level.sh).
opt-level = 2
lto = "fat"
codegen-units = 1
# Nothing that ships is stripped — not even the debug information Cargo would
# otherwise strip from a profile without its own: the symbols stay, to debug
# with, and so that no binary looks as though it hides what it is.
strip = "none"

# The libraries' own code carries full debug information (-O2 -g), so
# libnanochrono can be stepped through in a debugger as shipped. Only these
# crates: the same for every dependency (iced, wgpu…) would make the GUI
# nearly ten times its size.
[profile.dist.package.nanochrono-core]
debug = true

[profile.dist.package.nanochrono-crypto]
debug = true

[profile.dist.package.nanochrono-ffi]
debug = true

[profile.dist.package.nanochrono-android]
debug = true

# The programs' own code carries line tables: a backtrace names the file and
# line, and macOS gets a .dSYM for each program too (rustc runs dsymutil only
# for a crate with debug information of its own).
[profile.dist.package.nanochrono-cli]
debug = "line-tables-only"

[profile.dist.package.nanochrono-gui]
debug = "line-tables-only"

[profile.dist.package.nanochrono-bench]
debug = "line-tables-only"

# Measurement code must not be folded away by the optimiser in ways a debug
# build would hide, and the numbers a benchmark reports should be the numbers
# the shipped binary would produce — so the bench profile mirrors `dist`.
[profile.bench]
inherits = "dist"

# The -Og build: the dev profile's symbols and checks (debug info, debug
# assertions, overflow checks) with basic optimisation, so a bug that only
# shows once code is optimised turns up while it can still be stepped through.
# Rust has no -Og; opt-level 1 is its counterpart. Debugging uses both levels.
[profile.debug-og]
inherits = "dev"
opt-level = 1
